<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福井県 自転車盗難マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#19212b}header{padding:13px 20px;background:#1d2939;color:white}h1{font-size:21px;margin:0}.controls{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#f5f7fa}select{padding:8px;border:1px solid #ccd2dc;border-radius:6px}#map{height:calc(100vh - 170px);min-height:420px}.note{font-size:12px;padding:10px 20px;background:#fff4dc}.count{font-weight:700}.incident-marker{background:#d72c3c;border:2px solid #fff;border-radius:50%;color:#fff;box-shadow:0 1px 6px #0006;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;white-space:nowrap}.popup{line-height:1.6;min-width:230px;max-width:310px}.popup h3{margin:0 0 8px}.incident{padding:7px 0;border-top:1px solid #ddd}.incident:first-child{border-top:0}.incident-list{max-height:260px;overflow-y:auto}.muted{color:#596579;font-size:12px}
</style>
</head>
<body>
<header><h1>🚲 福井県 自転車盗難マップ（2025年）</h1></header>
<div class="controls">
<label>市区町村 <select id="city"><option value="">すべて</option></select></label>
<label>施錠 <select id="lock"><option value="">すべて</option></select></label>
<span class="count" id="count">読み込み中…</span>
</div>
<div id="map"></div>
<div class="note">※マーカー内の数字は同じ座標に登録された盗難件数です。座標は地域の代表地点の可能性があり、個別の建物や正確な発生場所を示すものではありません。</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([36.06,136.22],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=L.layerGroup().addTo(map);
let all=[];
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fill(id,values){const sel=document.getElementById(id);[...new Set(values)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ja')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
function popupFor(group){
  const incidents=group.map((x,i)=>`<div class="incident"><b>${i+1}件目</b><br>住所（町丁目等）：${escapeHtml(x.address)}<br>発生日：${escapeHtml(x.date)}<br>発生時：${escapeHtml(x.time)}<br>場所：${escapeHtml(x.place)}<br>詳細：${escapeHtml(x.detail)}<br>施錠：${escapeHtml(x.lock)}</div>`).join('');
  return `<div class="popup"><h3>🚲 この地点：${group.length}件</h3><div class="incident-list">${incidents}</div><p class="muted">※同じ座標の記録をまとめています。正確な建物位置を示すものではありません。</p></div>`;
}
function render(){
  markers.clearLayers();
  const city=document.getElementById('city').value,lock=document.getElementById('lock').value;
  const rows=all.filter(x=>(!city||x.city===city)&&(!lock||x.lock===lock));
  const groups=new Map();
  for(const x of rows){const key=`${x.lat},${x.lng}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x);}
  for(const group of groups.values()){
    const x=group[0],n=group.length,size=n>=100?42:n>=10?36:30;
    const icon=L.divIcon({className:'',html:`<div class="incident-marker" style="width:${size}px;height:${size}px">${n}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
    L.marker([x.lat,x.lng],{icon}).bindPopup(popupFor(group),{maxWidth:340}).addTo(markers);
  }
  document.getElementById('count').textContent=`盗難データ：${rows.length}件 ／ 表示地点：${groups.size}か所（全データ：${all.length}件）`;
}
fetch('/api/incidents').then(r=>{if(!r.ok)throw Error('取得失敗');return r.json()}).then(rows=>{all=rows;fill('city',rows.map(x=>x.city));fill('lock',rows.map(x=>x.lock));render();}).catch(e=>{console.error(e);document.getElementById('count').textContent='データの読み込みに失敗しました';});
document.getElementById('city').addEventListener('change',render);
document.getElementById('lock').addEventListener('change',render);
</script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福井県 自転車盗難マップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,sans-serif;color:#19212b}header{padding:13px 20px;background:#1d2939;color:white}h1{font-size:21px;margin:0}.controls{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#f5f7fa}select{padding:8px;border:1px solid #ccd2dc;border-radius:6px}#map{height:calc(100vh - 170px);min-height:420px}.note{font-size:12px;padding:10px 20px;background:#fff4dc}.popup{line-height:1.7}.count{font-weight:700}</style></head><body><header><h1>🚲 福井県 自転車盗難マップ（2025年）</h1></header><div class="controls"><label>市区町村 <select id="city"><option value="">すべて</option></select></label><label>施錠 <select id="lock"><option value="">すべて</option></select></label><span class="count" id="count">読み込み中…</span></div><div id="map"></div><div class="note">※表示地点はCSVの座標に基づきます。実際の盗難発生地点・建物を正確に示すものではありません。個人や施設への推測・断定は避けてください。</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([36.06,136.22],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=L.layerGroup().addTo(map);let all=[];
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fill(id,values){const sel=document.getElementById(id);[...new Set(values)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ja')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});}
function render(){markers.clearLayers();const city=document.getElementById('city').value,lock=document.getElementById('lock').value;const rows=all.filter(x=>(!city||x.city===city)&&(!lock||x.lock===lock));for(const x of rows){const p=`<div class="popup"><b>自転車盗難</b><br>住所（町丁目等）：${escapeHtml(x.address)}<br>発生日：${escapeHtml(x.date)}<br>発生時：${escapeHtml(x.time)}<br>場所：${escapeHtml(x.place)}<br>詳細：${escapeHtml(x.detail)}<br>施錠：${escapeHtml(x.lock)}<br><small>※座標は代表地点の可能性があります</small></div>`;L.circleMarker([x.lat,x.lng],{radius:7,color:'#ad1f2c',fillColor:'#e23b48',fillOpacity:.8,weight:1}).bindPopup(p).addTo(markers);}document.getElementById('count').textContent=`表示件数：${rows.length}件`;}
fetch('/api/incidents').then(r=>{if(!r.ok)throw Error('取得失敗');return r.json()}).then(rows=>{all=rows;fill('city',rows.map(x=>x.city));fill('lock',rows.map(x=>x.lock));render();}).catch(()=>{document.getElementById('count').textContent='データの読み込みに失敗しました';});
document.getElementById('city').addEventListener('change',render);document.getElementById('lock').addEventListener('change',render);
</script></body></html>
